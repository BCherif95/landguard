# LA BOUSSOLE — local stack.
# Run from this directory: docker compose up --build

services:
  mysql:
    image: mysql:8.0
    container_name: laboussole-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-laboussole}
      MYSQL_USER: ${MYSQL_USER:-laboussole}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-laboussole}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: laboussole-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./landguard-api
      dockerfile: Dockerfile
    container_name: laboussole-api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-laboussole}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATASOURCE_USERNAME: ${MYSQL_USER:-laboussole}
      DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-laboussole}
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktc2VjcmV0LWtleS1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24tcGxlYXNl}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"

volumes:
  mysql_data:
