spring:
  application:
    name: landguard-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATASOURCE_URL:jdbc:mysql://localhost:3306/laboussole?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATASOURCE_USERNAME:root}
    password: ${DATASOURCE_PASSWORD:BCherif9085}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

laboussole:
  security:
    jwt:
      issuer: laboussole-api
      access-token-ttl: PT15M
      refresh-token-ttl: P30D
      # 32+ bytes, base64-encoded. Override via env in any non-dev profile.
      secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24tcGxlYXNl}
      # Dedicated signing key for refresh tokens (falls back to `secret` when empty).
      refresh-secret: ${JWT_REFRESH_SECRET:ZGV2LW9ubHktcmVmcmVzaC1zZWNyZXQta2V5LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ocr:
    # Directory holding fra.traineddata; empty = Tesseract default (TESSDATA_PREFIX).
    tessdata-path: ${TESSDATA_PATH:}
    language: ${OCR_LANGUAGE:fra}
  notification:
    email-from: ${ALERT_EMAIL_FROM:alertes@laboussole.ml}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    sms:
      twilio:
        account-sid: ${TWILIO_ACCOUNT_SID:}
        auth-token: ${TWILIO_AUTH_TOKEN:}
        from-number: ${TWILIO_FROM_NUMBER:}
        api-base-url: ${TWILIO_API_BASE_URL:https://api.twilio.com}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.laboussole: DEBUG
    org.springframework.security: INFO
