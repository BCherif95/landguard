spring:
  application:
    name: landguard-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATASOURCE_URL:jdbc:mysql://localhost:3306/laboussole?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATASOURCE_USERNAME:root}
    password: ${DATASOURCE_PASSWORD:BCherif9085}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
        format_sql: false
  servlet:
    multipart:
      # The upload UI allows document scans up to 5 MB; satellite snapshots
      # can be larger. Kept above both so Tomcat never rejects them at 1 MB.
      max-file-size: 15MB
      max-request-size: 20MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

laboussole:
  bootstrap:
    # First-run administrator; created at startup if the e-mail is unknown.
    # Leave empty to skip. No credentials are ever seeded from migrations.
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Administrateur}
  security:
    jwt:
      issuer: laboussole-api
      access-token-ttl: PT15M
      refresh-token-ttl: P30D
      # 32+ bytes, base64-encoded. Override via env in any non-dev profile.
      secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24tcGxlYXNl}
      # Dedicated signing key for refresh tokens (falls back to `secret` when empty).
      refresh-secret: ${JWT_REFRESH_SECRET:ZGV2LW9ubHktcmVmcmVzaC1zZWNyZXQta2V5LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    root: ${STORAGE_ROOT:/Users/cherif/Projects/uploads/landguard}
    encryption:
      # AES-256 key for documents at rest (PRD 2.1), base64-encoded 32 bytes.
      # Dev-only default — always override via env outside local development.
      # Blank value disables encryption (logged loudly at startup).
      key: ${STORAGE_ENCRYPTION_KEY:41ZfeQFM3H8pmwc84DC6Fr1adlVtxWEZzaW+4mATJiY=}
  satellite:
    sentinel2:
      # Copernicus Data Space credentials (https://dataspace.copernicus.eu).
      # Blank values disable the scheduled acquisition; manual snapshot upload
      # via POST /api/v1/monitoring/snapshots keeps working either way.
      client-id: ${SENTINEL2_CLIENT_ID:}
      client-secret: ${SENTINEL2_CLIENT_SECRET:}
      token-url: ${SENTINEL2_TOKEN_URL:https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token}
      process-url: ${SENTINEL2_PROCESS_URL:https://sh.dataspace.copernicus.eu/api/v1/process}
      # Daily check at 06:00 UTC; Sentinel-2 revisits Mali about every 5 days.
      cron: ${SENTINEL2_CRON:0 0 6 * * *}
      lookback-days: 10
      max-cloud-coverage: 20
      image-width-px: 512
      bbox-padding-ratio: 0.2
      parcel-batch-limit: 500
  ocr:
    # Directory holding fra.traineddata; empty = Tesseract default (TESSDATA_PREFIX).
    tessdata-path: ${TESSDATA_PATH:}
    language: ${OCR_LANGUAGE:fra}
  notification:
    email-from: ${ALERT_EMAIL_FROM:alertes@laboussole.ml}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    sms:
      twilio:
        account-sid: ${TWILIO_ACCOUNT_SID:}
        auth-token: ${TWILIO_AUTH_TOKEN:}
        from-number: ${TWILIO_FROM_NUMBER:}
        api-base-url: ${TWILIO_API_BASE_URL:https://api.twilio.com}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.laboussole: DEBUG
    org.springframework.security: INFO
