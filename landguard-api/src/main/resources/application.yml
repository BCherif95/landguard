spring:
  application:
    name: landguard-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    group:
      # The demo scenario seeds fictional land records and is a development
      # tool: activating `demo` alone left the application with no secrets at
      # all and a cryptic "JWT secret must be at least 32 bytes". It now pulls
      # in `dev`, so `-Dspring-boot.run.profiles=demo` works as anyone would
      # expect. `demo` is never activated outside development.
      demo: dev
  config:
    # Optional, git-ignored local overrides — where a developer puts the
    # password of their own MySQL instance. Absent in CI and in production,
    # where every value comes from the environment.
    import: optional:file:./application-local.yml
  datasource:
    # No defaults on purpose. Every credential below must come from the
    # environment (or from application-dev.yml, which holds throwaway local
    # values only). A deployment that forgets to set them must fail to start,
    # not fall back to a value that is readable in the repository.
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
        format_sql: false
  servlet:
    multipart:
      # The upload UI allows document scans up to 5 MB; satellite snapshots
      # can be larger. Kept above both so Tomcat never rejects them at 1 MB.
      max-file-size: 15MB
      max-request-size: 20MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      # An SMTP probe must not decide whether this application is healthy: the
      # API serves every land-registry function without it, and undelivered
      # e-mails are already tracked — with retries and a dead-letter state — in
      # the `alert_deliveries` ledger, which is a far better signal than a
      # connection test run once at startup. Left on, a local machine with no
      # SMTP server reports the whole service DOWN to any orchestrator probe.
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}

laboussole:
  bootstrap:
    # First-run administrator; created at startup if the e-mail is unknown.
    # Leave empty to skip. No credentials are ever seeded from migrations.
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Administrateur}
    # DEV PROFILE ONLY: seeds one demo account per role on startup.
    # Configured in application-dev.yml; never active outside `dev`.
  security:
    jwt:
      issuer: laboussole-api
      access-token-ttl: PT15M
      refresh-token-ttl: P30D
      # 32+ bytes once base64-decoded. Environment-supplied, no fallback.
      secret: ${JWT_SECRET}
      # Dedicated signing key for refresh tokens, so a leaked access-token key
      # cannot mint long-lived refresh tokens. Falls back to `secret` if blank.
      refresh-secret: ${JWT_REFRESH_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    root: ${STORAGE_ROOT}
    encryption:
      # AES-256 key for documents at rest (PRD 2.1), base64-encoded 32 bytes.
      # Environment-supplied. A blank key disables encryption, which
      # SecretsHardeningValidator refuses outside the dev profile.
      key: ${STORAGE_ENCRYPTION_KEY:}
  satellite:
    sentinel2:
      # Copernicus Data Space credentials (https://dataspace.copernicus.eu).
      # Blank values disable the scheduled acquisition; manual snapshot upload
      # via POST /api/v1/monitoring/snapshots keeps working either way.
      client-id: ${SENTINEL2_CLIENT_ID:}
      client-secret: ${SENTINEL2_CLIENT_SECRET:}
      token-url: ${SENTINEL2_TOKEN_URL:https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token}
      process-url: ${SENTINEL2_PROCESS_URL:https://sh.dataspace.copernicus.eu/api/v1/process}
      # Daily check at 06:00 UTC; Sentinel-2 revisits Mali about every 5 days.
      cron: ${SENTINEL2_CRON:0 0 6 * * *}
      lookback-days: 10
      max-cloud-coverage: 20
      image-width-px: 512
      bbox-padding-ratio: 0.2
      parcel-batch-limit: 500
  ocr:
    # Directory holding fra.traineddata; empty = Tesseract default (TESSDATA_PREFIX).
    tessdata-path: ${TESSDATA_PATH:}
    language: ${OCR_LANGUAGE:fra}
  notification:
    email-from: ${ALERT_EMAIL_FROM:alertes@laboussole.ml}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    # Durable alert queue (table `alert_deliveries`). Alerts are committed with
    # the monitoring event, then drained here — never dispatched from memory.
    dispatch:
      interval-ms: ${ALERT_DISPATCH_INTERVAL_MS:10000}
      initial-delay-ms: ${ALERT_DISPATCH_INITIAL_DELAY_MS:15000}
      batch-size: ${ALERT_DISPATCH_BATCH_SIZE:50}
      # 5 attempts with a 1 min base doubles to 1/2/4/8 min, then dead-letter.
      max-attempts: ${ALERT_DISPATCH_MAX_ATTEMPTS:5}
      base-backoff: ${ALERT_DISPATCH_BASE_BACKOFF:PT1M}
      # An IN_FLIGHT delivery older than this is assumed abandoned by a dead
      # worker and returned to the queue.
      stale-after: ${ALERT_DISPATCH_STALE_AFTER:PT10M}
    sms:
      twilio:
        account-sid: ${TWILIO_ACCOUNT_SID:}
        auth-token: ${TWILIO_AUTH_TOKEN:}
        from-number: ${TWILIO_FROM_NUMBER:}
        api-base-url: ${TWILIO_API_BASE_URL:https://api.twilio.com}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.laboussole: DEBUG
    org.springframework.security: INFO
